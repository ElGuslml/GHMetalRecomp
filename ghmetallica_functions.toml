# ghmetallica_functions.toml - Manual corrections for the analyzer (default.xex): functions it missed, [[switch_tables]] the
# codegen mistranslates and [[midasm_hook]]s into src/. KameoRecomp's kameo_functions.toml, POTCAWERecomp's
# potcawe_functions.toml and GRAWRecomp's yeti_functions.toml have examples of each.
#
# Later, as in those games: the C runtime's setjmp_address / longjmp_address (with share_registers on their
# callers), then the *_as_local codegen options (the registers as local variables, a CPU gain), each checked as
# CLAUDE.md says.

[functions]
# Branch (b) targets that the automatic analysis did not assign to any function. All are small functions
# reached only through tail calls, each right after an unconditional end (b, bctr, blr): virtual call thunks
# (lwz r11,0(r3) / lwz r10,N(r11) / mtctr / bctr), a byte setter, a null check before a tail call and a
# one-instruction thunk.
0x8222E528 = {}   # branched to from 0x8222E8F4 (b 0x8222E190, a one-instruction thunk)
0x8238B140 = {}   # branched to from 0x823C435C (virtual call thunk, slot 108)
0x8238B1D0 = {}   # branched to from 0x823C4584 (virtual call thunk, slot 156)
0x82477EE8 = {}   # branched to from 0x823336EC and 0x82333708 (sets the byte at +241)
0x82683A38 = {}   # branched to from 0x8256A818 (null check, then b 0x82532A60)

# The game's threads wait without spinning (src/thread_waits.cpp): four loops checked a condition again and
# again and kept a core at 100 % each (the three job workers, the main thread at the start of a frame and while
# it waits for the render thread, the render thread waiting for the vertical blank). Each hook spins briefly and then sleeps between checks;
# ghmetallica_wait_sleep_us = 0 disables them.
[[midasm_hook]]
address = 0x82425A78   # li r4,0 (sub_82425A18: a job worker with an empty queue, before WaitForSingleObject(event, 0))
name = "GHMetallicaJobWaitHook"
[[midasm_hook]]
address = 0x822E4600   # cmplwi cr6,r3,0 (sub_822E4588: while (sub_8243C3D8(0x82C129E8) != 0) {})
name = "GHMetallicaFrameWaitHook"
registers = ["r3"]
[[midasm_hook]]
address = 0x822E0C44   # cmplw cr6,r11,r10 (sub_822E0C10: while (frames[24] == frames[20]) {}, waiting for the render thread)
name = "GHMetallicaRenderWaitHook"
registers = ["r11", "r10"]
[[midasm_hook]]
address = 0x8241C954   # cmpld cr6,r3,r11 (sub_8241C840: until the vertical blank counter reaches the next value)
name = "GHMetallicaVblankWaitHook"
registers = ["r3", "r11"]
[[midasm_hook]]
address = 0x8241CA9C   # cmpld cr6,r3,r30 (sub_8241C840: until the other counter reaches the frame's last vertical blank)
name = "GHMetallicaVblankWaitHook"
registers = ["r3", "r30"]

# Songs in sync with their audio (src/timer.cpp): the engine's timer replaces the 50,000,000 Hz that
# KeQueryPerformanceFrequency reports by the original console's real timebase rate, 49,875,000; the SDK's timebase
# runs at 50 MHz, so the game's clock ran 0.25 % fast and the notes drifted ahead of the audio.
# ghmetallica_timer_fix = false disables it.
[[midasm_hook]]
address = 0x822D1058   # cmplw cr6,r11,r6 (sub_822D0FB8: r11 = the reported frequency, r6 = 50,000,000)
name = "GHMetallicaTimerFrequencyHook"
registers = ["r6"]


# Quitting from the title screen and the main menu (src/quit_prompt.cpp): once per frame, the hook looks the screens'
# own elements up in the game's element table and offers the SDK's quit prompt (B) while one exists.
[[midasm_hook]]
address = 0x822E45F4   # stfd f0,3072(r7) (sub_822E4588: the main thread's frame, before its wait)
name = "GHMetallicaQuitPromptHook"

# Ultrawide (src/widescreen.cpp), with ghmetallica_ultrawide: the engine's screen aspect ratio, which its cameras read,
# follows the window (3D views see more to the sides); root_window, which every screen element hangs from, is narrowed
# around the center (the menus, the HUD and the note highway stay 16:9).
[[midasm_hook]]
address = 0x8238F918   # lis r11,-32081 (entry of sub_8238F918: f1 = the screen's aspect ratio, SetScreen)
name = "GHMetallicaScreenAspectHook"
registers = ["f1"]
[[midasm_hook]]
address = 0x82376084   # loc_82376084 in sub_82375E08: a screen element's summed properties, after root_window's own copy
name = "GHMetallicaRootElementHook"
registers = ["r31"]

