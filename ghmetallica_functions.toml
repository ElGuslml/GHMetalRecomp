# ghmetallica_functions.toml - Manual corrections for the analyzer (default.xex): functions it missed, [[switch_tables]] the
# codegen mistranslates and [[midasm_hook]]s into src/. KameoRecomp's kameo_functions.toml, POTCAWERecomp's
# potcawe_functions.toml and GRAWRecomp's yeti_functions.toml have examples of each.

# The C runtime's setjmp and longjmp (sub_8252F5B0 saves f14-f31, r13-r31, v64-v127, r1, LR and CR in the jmp_buf;
# sub_8252EF50 unwinds to it and loads them back), the same code as in KameoRecomp. The codegen turns calls to them
# into the host's setjmp and longjmp, keyed by the guest jmp_buf; translated as plain functions, longjmp would load
# the registers and return to its caller instead of jumping. Only the image decoders use them: libjpeg
# (sub_821DF7E0: setjmp at its error manager + 144, where its error function sub_821DE890 longjmps back) and libpng
# (sub_821DFA00, sub_821F3028: setjmp at the start of the png struct, longjmp from sub_821F12A0 and sub_821DE958).
setjmp_address = 0x8252F5B0
longjmp_address = 0x8252EF50

# Codegen: the registers no call passes on are local variables of each function, not fields of the PPCContext, so
# the compiler keeps them in host registers and the __savegprlr/__restgprlr helpers are elided, as in KameoRecomp,
# GRAWRecomp and POTCAWERecomp. non_argument_as_local (r0, r2, r11, r12) stays off: the SEH funclets read r12, which
# the SDK does not pass them. The non-volatile vector registers stay in the context (SDK change 42): this game's
# compiler passes values to its callees in them, outside the calling convention. sub_82697A78, sub_82699540 and
# sub_8269B6F0 set v92 (vor128 v92,v12,v12) and call sub_826973D8, whose callees sub_8269F488, sub_8269F770 and
# sub_8269FBB0 read it without writing it (vmsum4fp128 v23,v92,v24); as local variables v92 would be unset there.
non_volatile_as_local = true
non_volatile_vectors_as_local = false
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true

[functions]
# The functions that call setjmp keep their registers in the context (share_registers): the host longjmp returns
# into their C++ frame, and the codegen restores the context it saved at the setjmp, not local variables. The guest
# longjmp loaded r14-r31 with their values at the setjmp. None of them calls longjmp itself, so their ends (from
# .pdata) do not move.
0x821DF7E0 = { share_registers = true }   # libjpeg's guard
0x821DFA00 = { share_registers = true }   # libpng's guards
0x821F3028 = { share_registers = true }
# Branch (b) targets that the automatic analysis did not assign to any function. All are small functions
# reached only through tail calls, each right after an unconditional end (b, bctr, blr): virtual call thunks
# (lwz r11,0(r3) / lwz r10,N(r11) / mtctr / bctr), a byte setter, a null check before a tail call and a
# one-instruction thunk.
0x8222E528 = {}   # branched to from 0x8222E8F4 (b 0x8222E190, a one-instruction thunk)
0x8238B140 = {}   # branched to from 0x823C435C (virtual call thunk, slot 108)
0x8238B1D0 = {}   # branched to from 0x823C4584 (virtual call thunk, slot 156)
0x82477EE8 = {}   # branched to from 0x823336EC and 0x82333708 (sets the byte at +241)
0x82683A38 = {}   # branched to from 0x8256A818 (null check, then b 0x82532A60)

# The game's threads wait without spinning (src/thread_waits.cpp): four loops checked a condition again and
# again and kept a core at 100 % each (the three job workers, the main thread at the start of a frame and while
# it waits for the render thread, the render thread waiting for the vertical blank). Each hook spins briefly and then sleeps between checks;
# ghmetallica_wait_sleep_us = 0 disables them. With ghmetallica_wait_smart (on) the workers block on the job event,
# the render thread sleeps until shortly before the vertical blank, and the main thread waiting for a job group
# (sub_822BAD30) watches the group's count between passes instead of taking the queue's lock again at once.
[[midasm_hook]]
address = 0x82425A78   # li r4,0 (sub_82425A18: a job worker with an empty queue, before WaitForSingleObject(event, 0))
name = "GHMetallicaJobWaitHook"
# A job queued (sub_822BB198) pulses the manual-reset job event, which woke every waiting worker for one job: with
# ghmetallica_job_wake_one the hook wakes one waiting worker itself and the pulse is skipped.
[[midasm_hook]]
address = 0x822BA9C0   # lis r11,-32087 (sub_822BA9C0: NtPulseEvent on the job event at 0x82A8D574)
name = "GHMetallicaJobPulseHook"
return_on_true = true
[[midasm_hook]]
address = 0x822E4600   # cmplwi cr6,r3,0 (sub_822E4588: while (sub_8243C3D8(0x82C129E8) != 0) {})
name = "GHMetallicaFrameWaitHook"
registers = ["r3"]
[[midasm_hook]]
address = 0x822E0C44   # cmplw cr6,r11,r10 (sub_822E0C10: while (frames[24] == frames[20]) {}, waiting for the render thread)
name = "GHMetallicaRenderWaitHook"
registers = ["r11", "r10"]
[[midasm_hook]]
address = 0x8241C954   # cmpld cr6,r3,r11 (sub_8241C840: until the vertical blank counter reaches the next value)
name = "GHMetallicaVblankWaitHook"
registers = ["r3", "r11"]
[[midasm_hook]]
address = 0x8241CA9C   # cmpld cr6,r3,r30 (sub_8241C840: until the other counter reaches the frame's last vertical blank)
name = "GHMetallicaVblankWait2Hook"
registers = ["r3", "r30"]
# The game's two callbacks advance the counters those loops wait on: an event set right after each advance wakes the
# waiting render thread at once (src/thread_waits.cpp).
[[midasm_hook]]
address = 0x822D0D04   # lwz r10,40(r11) (sub_822D0CC8, the swap callback: after the swap counter 0x82A925A0's advance)
name = "GHMetallicaSwapSignalHook"
[[midasm_hook]]
address = 0x822D0CB4   # mftb r4 (sub_822D0C80, the vertical blank callback: after the counter 0x82A92590's advance)
name = "GHMetallicaVblankSignalHook"
[[midasm_hook]]
address = 0x822BADA4   # lwz r11,20(r29) (sub_822BAD30: the main thread waiting for a job group, after a pass)
name = "GHMetallicaJobGroupWaitHook"
registers = ["r29", "r30"]
# The D3D library's six waits for the GPU (fences, the present, ...) call sub_821C5A48 for every check: at 120 FPS
# the render thread spent half its time there.
[[midasm_hook]]
address = 0x821C5A48   # mflr r12 (entry of sub_821C5A48: a check of a wait for the GPU, its condition still false)
name = "GHMetallicaGpuWaitHook"

# Songs in sync with their audio (src/timer.cpp): the engine's timer replaces the 50,000,000 Hz that
# KeQueryPerformanceFrequency reports by the original console's real timebase rate, 49,875,000; the SDK's timebase
# runs at 50 MHz, so the game's clock ran 0.25 % fast and the notes drifted ahead of the audio.
# ghmetallica_timer_fix = false disables it.
[[midasm_hook]]
address = 0x822D1058   # cmplw cr6,r11,r6 (sub_822D0FB8: r11 = the reported frequency, r6 = 50,000,000)
name = "GHMetallicaTimerFrequencyHook"
registers = ["r6"]


# Quitting from the title screen and the main menu (src/quit_prompt.cpp): once per frame, the hook looks the screens'
# own elements up in the game's element table and offers the SDK's quit prompt (B) while one exists.
[[midasm_hook]]
address = 0x822E45F4   # stfd f0,3072(r7) (sub_822E4588: the main thread's frame, before its wait)
name = "GHMetallicaQuitPromptHook"

# A slot's kind of controller (a guitar, the drums, the singer) follows the controller played (src/players.cpp): the
# game asks for it only when the port's controller connects, and the keyboard shares slot 0 with the first controller.
[[midasm_hook]]
address = 0x8239DFB8   # mflr r12 (entry of sub_8239DFB8: a controller port's update, each frame; r3 = the port)
name = "GHMetallicaControllerPortHook"
registers = ["r3"]

# Ultrawide (src/widescreen.cpp), with ghmetallica_ultrawide: the projection of every 16:9 view is widened (Hor+: the
# 3D views see more at the sides; their aspect ratio is the view's size, not the SetScreen aspect), and the screen
# elements' vertices (pixels of the 1280x720 canvas) are narrowed around the center just before they are drawn to the
# screen (the menus, the HUD, the note highway and its notes stay 16:9), with the clip windows they draw through.
[[midasm_hook]]
address = 0x82356538   # entry of sub_82356538, a perspective projection from its frustum (f1-f4: left, right, bottom, top)
name = "GHMetallicaFrustumHook"
registers = ["f1", "f2", "f3", "f4"]
[[midasm_hook]]
address = 0x82421D78   # bl DrawVerticesUP in sub_82421B60 (a sprite's quad: r6 = its vertices, r7 = their stride)
name = "GHMetallicaSpriteHook"
registers = ["r6", "r7"]
[[midasm_hook]]
address = 0x82465718   # bl DrawVerticesUP in sub_82465228 (another element's quad: the loading screen's layers)
name = "GHMetallicaElementQuadHook"
registers = ["r6", "r7"]
[[midasm_hook]]
address = 0x82454A68   # bl DrawVerticesUP in sub_82454990 (a batch of quads: r5 = vertices, r6 = data, r7 = stride)
name = "GHMetallicaSpriteBatchHook"
registers = ["r5", "r6", "r7"]
[[midasm_hook]]
address = 0x82420B84   # bl SetScissorRect in sub_82420A20 (a screen element's clip window: r4 = {x1, y1, x2, y2})
name = "GHMetallicaClipWindowHook"
registers = ["r4"]
[[midasm_hook]]
address = 0x821B5A74   # bl DrawVerticesUP in sub_821B4FB0 (a sustained note's tail: r5 = vertices, r6 = data, r7 = stride)
name = "GHMetallicaTailHook"
registers = ["r5", "r6", "r7"]
[[midasm_hook]]
address = 0x823F78A4   # mr r3,r31 at the end of sub_823F7800 (the online matchmaker's constructor: its times read)
name = "GHMetallicaMatchmakerHook"
registers = ["r31"]
[[midasm_hook]]
address = 0x821B70DC   # lwz r11,13296(r20) in sub_821B69B0 (the tap notes' trail: its control points at r1 + 544)
name = "GHMetallicaTapTrailHook"
registers = ["r1"]
[[midasm_hook]]
address = 0x821B3498   # bl EndVertices in sub_821B2ED8 (a sprite drawn as a grid of quads, the highway's board: r3 = device)
name = "GHMetallicaMeshSpriteHook"
registers = ["r3"]
[[midasm_hook]]
address = 0x821B7B44   # bl DrawVerticesUP in sub_821B79F8 (a 2D particle's quad: r5 = vertices, r6 = data, r7 = stride)
name = "GHMetallicaParticleHook"
registers = ["r5", "r6", "r7"]


# Frame rates above 60 (src/framerate.cpp, ghmetallica_frame_rate_fix): the engine's clocks counted in vertical blanks
# divide by its vertical blanks per second (the global 0x82839118, 60): the divisions use it times the emulated
# vblank's rate over 60, so those clocks keep their speed (no visible case known).
[[midasm_hook]]
address = 0x824B1C68   # extsw r8,r30 (sub_824B1B00: a vblank clock's vblanks into seconds, r30 = vblanks per second)
name = "GHMetallicaVblankClockHook"
registers = ["r30"]
[[midasm_hook]]
address = 0x824B1EF0   # extsw r11,r30 (sub_824B1B00: seconds back into vblanks, r30 = vblanks per second)
name = "GHMetallicaVblankClockHook"
registers = ["r30"]
[[midasm_hook]]
address = 0x822D0E00   # extsw r5,r10 (sub_822D0DE0: the frame's vblanks into its time, r10 = vblanks per second)
name = "GHMetallicaVblankFrameTimeHook"
registers = ["r10"]
# Script waits counted in game frames ("Wait N gameframes"): above 60 Hz they last the console's N / 60 s.
[[midasm_hook]]
address = 0x8242A018   # entry of sub_8242A018 (a type 1 game-frame wait set: r3 = the wait, r4 = N)
name = "GHMetallicaFrameWaitSetHook"
registers = ["r3", "r4"]
[[midasm_hook]]
address = 0x82429FC8   # entry of sub_82429FC8 (a type 8 game-frame wait set: r3 = the wait, r4 = N)
name = "GHMetallicaFrameWaitSetHook"
registers = ["r3", "r4"]
[[midasm_hook]]
address = 0x8242A35C   # addi r11,r11,-1 (sub_8242A318: a game-frame wait's count above 0, r3 = the wait)
name = "GHMetallicaFrameWaitCountHook"
registers = ["r3", "r11"]
# Button presses polled by scripts (ControllerMake) last one frame: a script whose waits are held above 60 Hz is given
# the presses of the frames it skipped.
[[midasm_hook]]
address = 0x8239BD4C   # bgt cr6 (sub_8239BB88: a controller's input state updated, r30 = the state, r9 = the pressed bits)
name = "GHMetallicaInputUpdateHook"
registers = ["r30", "r9"]
[[midasm_hook]]
address = 0x823B6D50   # entry of sub_823B6D50 (the script function ControllerMake: r4 = the script)
name = "GHMetallicaButtonPollHook"
registers = ["r4"]
[[midasm_hook]]
address = 0x823B6E10   # addi r1,r1,112 (sub_823B6D50's exit, every path)
name = "GHMetallicaButtonPollEndHook"
# The whammy on a sustain is told by the frame (the bar's movement since the previous frame, a countdown of 5 frames,
# 5 frames in a row to turn a star power sustain blue or back): above 60 Hz over a 60th of a second and 5 / 60 s.
[[midasm_hook]]
address = 0x82137F18   # mflr r12 (sub_82137F18: a player's update in a song, every frame; src/keyboard.cpp)
name = "GHMetallicaSongFrameHook"
[[midasm_hook]]
address = 0x821436A0   # fsubs f13,f30,f13 (sub_82143530, a guitar: the bar's position minus the previous frame's)
name = "GHMetallicaWhammyHook"
registers = ["r30", "f30", "f13"]
[[midasm_hook]]
address = 0x8214379C   # fsubs f12,f30,f0 (sub_82143530, another controller: the first axis minus the previous frame's)
name = "GHMetallicaWhammyHook"
registers = ["r30", "f30", "f0"]
[[midasm_hook]]
address = 0x821437B0   # fsubs f0,f29,f0 (sub_82143530, another controller: the second axis minus the previous frame's)
name = "GHMetallicaWhammy2Hook"
registers = ["r30", "f29", "f0"]
[[midasm_hook]]
address = 0x8214652C   # fsubs f13,f0,f13 (sub_821463B0, the touch strip: its position minus the previous frame's)
name = "GHMetallicaWhammyHook"
registers = ["r31", "f0", "f13"]
[[midasm_hook]]
address = 0x821436D0   # stwx r10,r30,r8 (sub_82143530: the whammy countdown, 5 frames)
name = "GHMetallicaWhammyCountdownHook"
registers = ["r10"]
[[midasm_hook]]
address = 0x821437D0   # lfs f13,11328(r8) (sub_82143530: r10 = 5, the countdown both axes store)
name = "GHMetallicaWhammyCountdownHook"
registers = ["r10"]
[[midasm_hook]]
address = 0x82146558   # stwx r9,r31,r8 (sub_821463B0: the whammy countdown, 5 frames)
name = "GHMetallicaWhammyCountdownHook"
registers = ["r9"]
[[midasm_hook]]
address = 0x82146790   # cmpwi cr6,r11,5 (sub_82146590: frames in a row of whammying)
name = "GHMetallicaWhammyStateHook"
registers = ["r11"]
[[midasm_hook]]
address = 0x8214686C   # cmpwi cr6,r11,5 (sub_82146590: frames in a row of not whammying)
name = "GHMetallicaWhammyStateHook"
registers = ["r11"]
# The guitars' strings vibrate at 62 Hz, which 60 FPS shows as a 2 Hz wobble, and fade 0.99 a frame: above 60 Hz the
# wobble 60 FPS shows and the fade per 60th of a second.
[[midasm_hook]]
address = 0x821221B8   # lis r11,-32254 (sub_82122138, after the call returning the strings' frequency, 62 Hz)
name = "GHMetallicaStringFrequencyHook"
registers = ["f1"]
[[midasm_hook]]
address = 0x8211D00C   # lwz r11,252(r31) (sub_8211CFD0, after the call returning the strings' fade, 0.99 a frame)
name = "GHMetallicaStringFadeHook"
registers = ["f1"]
# Havok's world is stepped by a fixed 1/60 s each frame (the guitars' strings swung wildly above 60 FPS): above 60 Hz by
# the frame's own time.
[[midasm_hook]]
address = 0x823B77E4   # fmuls f1,f1,f31 (sub_823B7798, after lfs f31,11196(r11): the world's step, 1/60 s)
name = "GHMetallicaPhysicsStepHook"
registers = ["f31"]
# The loading screen's animations step by the frame: above 60 Hz the steps are scaled by 60 / the rate.
[[midasm_hook]]
address = 0x824C2DC4   # after lfd f31,4208(r10) (sub_824C2CB0: the boot's spinning star, f31 = its turn each frame, 0.06 radians)
name = "GHMetallicaLoadingStarHook"
registers = ["f31"]
[[midasm_hook]]
address = 0x823F833C   # add r11,r10,r11 (sub_823F82F0: DisplayLoadingScreen's icon, its angle plus its step, r10 = the step in degrees)
name = "GHMetallicaLoadingSpinnerHook"
registers = ["r10"]
[[midasm_hook]]
address = 0x824C3250   # fadds f0,f0,f29 (sub_824C3028's mode 2: a wave's phase plus its step, f29)
name = "GHMetallicaLoadingWaveHook"
registers = ["f29"]
[[midasm_hook]]
address = 0x824C3260   # fadds f0,f13,f0 (sub_824C3028's mode 2: the other phase plus its step, f0)
name = "GHMetallicaLoadingWaveHook"
registers = ["f0"]
[[midasm_hook]]
address = 0x8239318C   # bne cr6 (sub_82392F58, the script function Wait, its seconds branch): r4 = the wait in ms, r30 = the script; src/crowd.cpp (and src/intro.cpp's legal notice)
name = "GHMetallicaScriptWaitSecondsHook"
registers = ["r4", "r30"]

# The screen effects each turned off by an option (src/screen_fx.cpp, ghmetallica_fx_*): the effects' composite
# (sub_8251EC80) picks its shader variant and sets each effect's constants by a mask, one bit per effect.
[[midasm_hook]]
address = 0x8251EEA8   # mr r11,r24 (sub_8251EC80), after lwz r31,12(r25): r31 = the effects' mask
name = "GHMetallicaScreenFxMaskHook"
registers = ["r31"]

# The game's debug menu offered in the main and pause menus (src/debug_menu.cpp, ghmetallica_debug_menu): the script
# global enable_button_cheats reads as 1 only in the scripts that build those menus. The script interpreter's
# statement (sub_822CF7C8, r31 = the script) evaluates expressions with sub_823AED90 at two places (none of these
# addresses is a branch target); sub_822BD1E8 resolves a "$name" component (r3) to the global's value.
[[midasm_hook]]
address = 0x822CF998   # lwz r3,16(r31), before bl 0x823AED90 at 0x822CF99C
name = "GHMetallicaScriptEvalEnterHook"
registers = ["r31"]
[[midasm_hook]]
address = 0x822CF9A0   # stw r3,16(r31), after it
name = "GHMetallicaScriptEvalLeaveHook"
[[midasm_hook]]
address = 0x822CFCAC   # bl 0x823AED90 (the other evaluation, reached past bne 0x822CFCB8)
name = "GHMetallicaScriptEvalEnterHook"
registers = ["r31"]
[[midasm_hook]]
address = 0x822CFCB0   # stw r3,16(r31), after it
name = "GHMetallicaScriptEvalLeaveHook"
[[midasm_hook]]
address = 0x822BD1E8   # lbz r11,2(r3) (the entry of sub_822BD1E8): r3 = the component
name = "GHMetallicaGlobalResolveHook"
registers = ["r3"]
return_on_true = true

# The boot's videos skipped (src/intro.cpp, ghmetallica_skip_intro): PlayMovie (sub_823CD8A0) has read its `movie`
# string into 84(r1) (bl 0x822B5EC8 at 0x823CD91C); r3 = found. Not found returns false without playing.
[[midasm_hook]]
address = 0x823CD920   # clrlwi r11,r3,24 (then beq 0x823CD8FC: return 0)
name = "GHMetallicaPlayMovieHook"
registers = ["r1", "r3"]
